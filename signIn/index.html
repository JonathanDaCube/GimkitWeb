<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in — Gimkit Community</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 24px;
      max-width: 600px;
      margin: 0 auto;
    }
    h1 { margin-top: 12px; }
    form { display:flex; flex-direction:column; gap:10px; margin-top:12px; }
    input { padding:10px 12px; border-radius:6px; border:1px solid #ccc; font-size:1rem; }
    button { padding:10px 14px; border-radius:6px; border:none; background:#007bff; color:white; cursor:pointer; font-size:1rem; }
    .google-btn { background:#4285F4; width:100%; }
    .auth-divider { display:flex; align-items:center; gap:10px; color:#666; font-size:0.9rem; }
    .auth-divider::before, .auth-divider::after { content:""; height:1px; background:#ddd; flex:1; }
    .error { color:#b33; min-height:20px; }
    .small { font-size:0.9rem; color:#555; }
    .link-area { border:1px dashed #ccc; padding:12px; border-radius:8px; margin-top:10px; }
  </style>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>
  <a href="/GimkitWeb/">← Back to site</a>
  <h1>Sign in</h1>

  <form id="signInForm" onsubmit="return false;">
    <input id="email" type="email" placeholder="Email" required autocomplete="username" />
    <input id="password" type="password" placeholder="Password" required autocomplete="current-password" />
    <button id="signInBtn" type="button">Sign in</button>
    <div class="auth-divider" aria-hidden="true">or</div>
    <button id="googleSignInBtn" type="button" class="google-btn">Sign in with Google</button>
    <div id="errorMsg" class="error" role="alert" aria-live="polite"></div>
  </form>

  <p class="small">Don't have an account? <a href="/GimkitWeb/signUp/">Create one</a></p>

  <!-- Extra UI shown when linking a new Google account to an email/password credential -->
  <div id="googleExtra" class="link-area" style="display:none;">
    <h2>Create account details</h2>
    <p class="small">We created an account for <span id="googleEmail"></span>. To finish setup, choose a username and password you can use to sign in directly later.</p>
    <input id="linkUsername" type="text" placeholder="Username" autocomplete="nickname" />
    <input id="linkPassword" type="password" placeholder="Password" autocomplete="new-password" />
    <input id="linkPasswordConfirm" type="password" placeholder="Confirm password" autocomplete="new-password" />
    <div style="display:flex; gap:8px; margin-top:6px;">
      <button id="linkBtn" type="button">Complete account</button>
      <button id="linkCancel" type="button" style="background:#6c757d;">Cancel</button>
    </div>
    <div id="linkError" class="error" role="alert" aria-live="polite"></div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDq6eOzOWLd88XG-wFo0LN1O3l2Yyvdfls",
      authDomain: "gimkit-web.firebaseapp.com",
      databaseURL: "https://gimkit-web-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "gimkit-web",
      storageBucket: "gimkit-web.firebasedestorage.app",
      messagingSenderId: "192282058649",
      appId: "1:192282058649:web:cdcdfdb49c429fc0e33d08",
      measurementId: "G-TLCCKP056J"
    };

    // Initialize Firebase only once in case other pages also initialize
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    } else {
      firebase.app();
    }
    const auth = firebase.auth();
    const usersRef = firebase.database().ref('users');

    // Ensure persistence (keeps user signed in across reloads/tabs)
    auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(e => console.warn('Could not set persistence:', e));

    const emailEl = document.getElementById('email');
    const passwordEl = document.getElementById('password');
    const signInBtn = document.getElementById('signInBtn');
    const googleSignInBtn = document.getElementById('googleSignInBtn');
    const errorMsg = document.getElementById('errorMsg');

    const googleExtra = document.getElementById('googleExtra');
    const googleEmail = document.getElementById('googleEmail');
    const linkUsername = document.getElementById('linkUsername');
    const linkPassword = document.getElementById('linkPassword');
    const linkPasswordConfirm = document.getElementById('linkPasswordConfirm');
    const linkBtn = document.getElementById('linkBtn');
    const linkCancel = document.getElementById('linkCancel');
    const linkError = document.getElementById('linkError');

    function showError(msg) { errorMsg.textContent = msg || ''; }
    function showLinkError(msg) { linkError.textContent = msg || ''; }

    function saveUserProfile(user) {
      const profile = {};
      if (user.displayName) profile.username = user.displayName;
      if (user.email) profile.email = user.email.toLowerCase();
      return usersRef.child(user.uid).update(profile);
    }

    // Basic email/password sign in
    signInBtn.addEventListener('click', () => {
      showError('');
      const email = emailEl.value.trim();
      const password = passwordEl.value;
      if (!email || !password) { showError('Please enter both email and password.'); return; }

      auth.signInWithEmailAndPassword(email, password)
        .then(async userCredential => {
          await saveUserProfile(userCredential.user);
          window.location.href = '/GimkitWeb/';
        })
        .catch(err => { console.error('Sign-in failed:', err); showError(err.message || 'Sign-in failed.'); });
    });

    // Google sign-in flow
    googleSignInBtn.addEventListener('click', () => {
      showError('');
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider)
        .then(result => {
          const isNew = result.additionalUserInfo && result.additionalUserInfo.isNewUser;
          const user = result.user;
          if (isNew) {
            // Show UI to let user pick a username and password to link to this account
            googleEmail.textContent = user.email || '';
            linkUsername.value = user.displayName || '';
            linkPassword.value = '';
            linkPasswordConfirm.value = '';
            showLinkError('');
            googleExtra.style.display = 'block';
            // Do not redirect yet — wait for user to complete linking
          } else {
            // Existing user, just redirect
            saveUserProfile(user)
              .then(() => { window.location.href = '/GimkitWeb/'; })
              .catch(err => {
                console.error('Could not save user profile:', err);
                showError(err.message || 'Could not save user profile.');
              });
          }
        })
        .catch(err => { console.error('Google sign-in failed:', err); showError(err.message || 'Google sign-in failed.'); });
    });

    // Cancel linking — sign out the just-created user and hide UI
    linkCancel.addEventListener('click', () => {
      googleExtra.style.display = 'none';
      showLinkError('');
      // Sign out the current user that was created by Google sign-in so they can try again
      if (auth.currentUser) {
        auth.signOut().catch(e => console.warn('Sign-out after cancel failed', e));
      }
    });

    // Complete linking: create an email/password credential and link to the Google account
    linkBtn.addEventListener('click', () => {
      showLinkError('');
      const username = linkUsername.value.trim();
      const password = linkPassword.value;
      const passwordConfirm = linkPasswordConfirm.value;
      const email = googleEmail.textContent;

      if (!username) { showLinkError('Please enter a username.'); return; }
      if (!password) { showLinkError('Please enter a password.'); return; }
      if (password !== passwordConfirm) { showLinkError('Passwords do not match.'); return; }
      if (!auth.currentUser) { showLinkError('No authenticated user. Please try signing in with Google again.'); return; }

      // Create credential and link
      const credential = firebase.auth.EmailAuthProvider.credential(email, password);
      auth.currentUser.linkWithCredential(credential)
        .then(() => {
          // Set displayName (username) on the linked account
          return auth.currentUser.updateProfile({ displayName: username });
        })
        .then(() => saveUserProfile(auth.currentUser))
        .then(() => {
          // Done — redirect to site
          window.location.href = '/GimkitWeb/';
        })
        .catch(err => {
          console.error('Linking credential failed:', err);
          // Common case: email already in use if an account exists with same email but different sign-in method
          if (err && err.code === 'auth/email-already-in-use') {
            showLinkError('That email is already in use with another account. Try signing in with email/password instead.');
          } else if (err && err.message) {
            showLinkError(err.message);
          } else {
            showLinkError('Could not complete account setup.');
          }
        });
    });

    // Helpful debug logging on auth state changes
    auth.onAuthStateChanged(user => console.log('onAuthStateChanged', user));
    auth.onIdTokenChanged(user => console.log('onIdTokenChanged', user));
  </script>
</body>
</html>
