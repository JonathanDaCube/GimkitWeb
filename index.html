<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gimkit Community Web</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    #activeGamesList, #activeMeetingsList { list-style: none; padding: 0; margin-top: 12px; }
    #activeGamesList li, #activeMeetingsList li { background: #f3f4f6; border-radius: 6px; padding: 8px 12px; margin: 6px 0; display:flex; justify-content:space-between; align-items:center; }
    button { margin-left: 8px; }
    .small { font-size: 0.9rem; color: #555; }
  </style>

  <!-- Firebase (compat for simpler example) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

<h1>Gimkit Community Website</h1>
<p class="small">Add and see active game codes and meetings in real-time (all visitors see updates instantly).</p>

<div>
  <label for="gameCodeInput">Active Games:</label>
  <form id="gameForm" style="margin-top:8px;">
    <input id="gameCodeInput" type="text" placeholder="Enter game code" aria-label="Game code" required />
    <button type="submit">Submit</button>
  </form>
  <ul id="activeGamesList" aria-live="polite"></ul>
</div>

<div style="margin-top:20px;">
  <label for="meetingInput">Active Meetings:</label>
  <form id="meetingForm" style="margin-top:8px;">
    <input id="meetingInput" type="text" placeholder="Enter meeting name or link" aria-label="Meeting" required />
    <button type="submit">Submit</button>
  </form>
  <ul id="activeMeetingsList" aria-live="polite"></ul>
</div>

<script>
  // ---------- REPLACE THIS WITH YOUR FIREBASE CONFIG ----------
  const firebaseConfig = {
    apiKey: "AIzaSyDq6eOzOWLd88XG-wFo0LN1O3l2Yyvdfls",
    authDomain: "gimkit-web.firebaseapp.com",
    databaseURL: "https://gimkit-web-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "gimkit-web",
    storageBucket: "gimkit-web.firebasestorage.app",
    messagingSenderId: "192282058649",
    appId: "1:192282058649:web:cdcdfdb49c429fc0e33d08",
    measurementId: "G-TLCCKP056J"
  };
  // -----------------------------------------------------------

  // Initialize Firebase
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.database();
  const activeGamesRef = db.ref('activeGames');
  const activeMeetingsRef = db.ref('activeMeetings');

  // Sign in anonymously so we can use auth-protected rules if you choose them
  auth.signInAnonymously().catch(err => {
    console.error('Auth error:', err);
  });

  const gameForm = document.getElementById('gameForm');
  const gameCodeInput = document.getElementById('gameCodeInput');
  const activeGamesList = document.getElementById('activeGamesList');

  const meetingForm = document.getElementById('meetingForm');
  const meetingInput = document.getElementById('meetingInput');
  const activeMeetingsList = document.getElementById('activeMeetingsList');

  // Local mapping of DB keys -> list items
  const listItems = {};
  const meetingItems = {};

  // Submit a new game code
  gameForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const raw = gameCodeInput.value.trim();
    if (!raw) return;
    const code = raw.toUpperCase().replace(/\s+/g, '');
    activeGamesRef.orderByChild('code').equalTo(code).once('value', snap => {
      if (snap.exists()) {
        gameCodeInput.value = '';
        gameCodeInput.focus();
        return;
      }
      const newRef = activeGamesRef.push();
      newRef.set({ code, createdAt: Date.now() }).catch(err => {
        console.error('Write failed (games):', err);
      });
      gameCodeInput.value = '';
      gameCodeInput.focus();
    });
  });

  meetingForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const raw = meetingInput.value.trim();
    if (!raw) return;
    const title = raw.replace(/\s+/g, ' ');
    activeMeetingsRef.orderByChild('title').equalTo(title).once('value', snap => {
      if (snap.exists()) {
        meetingInput.value = '';
        meetingInput.focus();
        return;
      }
      const newRef = activeMeetingsRef.push();
      newRef.set({ title, createdAt: Date.now() }).catch(err => {
        console.error('Write failed (meetings):', err);
      });
      meetingInput.value = '';
      meetingInput.focus();
    });
  });

  // Add game item when child is added
  activeGamesRef.on('child_added', snapshot => {
    const key = snapshot.key;
    const val = snapshot.val();
    if (!val || !val.code) return;
    const li = document.createElement('li');
    const text = document.createElement('span');
    text.textContent = val.code;
    const btns = document.createElement('span');

    const removeBtn = document.createElement('button');
    removeBtn.textContent = 'Remove';
    removeBtn.type = 'button';
    removeBtn.addEventListener('click', () => activeGamesRef.child(key).remove());

    btns.appendChild(removeBtn);
    li.appendChild(text);
    li.appendChild(btns);

    listItems[key] = li;
    activeGamesList.appendChild(li);
  });

  activeGamesRef.on('child_removed', snapshot => {
    const key = snapshot.key;
    const li = listItems[key];
    if (li && li.parentNode) li.parentNode.removeChild(li);
    delete listItems[key];
  });

  activeGamesRef.on('value', snapshot => {
    const items = [];
    snapshot.forEach(child => {
      const v = child.val();
      if (v && v.code) items.push({ key: child.key, code: v.code, createdAt: v.createdAt || 0 });
    });
    items.sort((a, b) => a.createdAt - b.createdAt);
    activeGamesList.innerHTML = '';
    items.forEach(item => {
      const li = document.createElement('li');
      const text = document.createElement('span');
      text.textContent = item.code;
      const removeBtn = document.createElement('button');
      removeBtn.textContent = 'Remove';
      removeBtn.type = 'button';
      removeBtn.addEventListener('click', () => activeGamesRef.child(item.key).remove());
      li.appendChild(text);
      li.appendChild(removeBtn);
      activeGamesList.appendChild(li);
      listItems[item.key] = li;
    });
  });

  activeMeetingsRef.on('child_added', snapshot => {
    const key = snapshot.key;
    const val = snapshot.val();
    if (!val || !val.title) return;
    const li = document.createElement('li');
    const text = document.createElement('span');
    text.textContent = val.title;
    const btns = document.createElement('span');

    const removeBtn = document.createElement('button');
    removeBtn.textContent = 'Remove';
    removeBtn.type = 'button';
    removeBtn.addEventListener('click', () => activeMeetingsRef.child(key).remove());

    btns.appendChild(removeBtn);
    li.appendChild(text);
    li.appendChild(btns);

    meetingItems[key] = li;
    activeMeetingsList.appendChild(li);
  });

  activeMeetingsRef.on('child_removed', snapshot => {
    const key = snapshot.key;
    const li = meetingItems[key];
    if (li && li.parentNode) li.parentNode.removeChild(li);
    delete meetingItems[key];
  });

  activeMeetingsRef.on('value', snapshot => {
    const items = [];
    snapshot.forEach(child => {
      const v = child.val();
      if (v && v.title) items.push({ key: child.key, title: v.title, createdAt: v.createdAt || 0 });
    });
    items.sort((a, b) => a.createdAt - b.createdAt);
    activeMeetingsList.innerHTML = '';
    items.forEach(item => {
      const li = document.createElement('li');
      const text = document.createElement('span');
      text.textContent = item.title;
      const removeBtn = document.createElement('button');
      removeBtn.textContent = 'Remove';
      removeBtn.type = 'button';
      removeBtn.addEventListener('click', () => activeMeetingsRef.child(item.key).remove());
      li.appendChild(text);
      li.appendChild(removeBtn);
      activeMeetingsList.appendChild(li);
      meetingItems[item.key] = li;
    });
  });
</script>

<p class="small" style="margin-top: 30px; text-align: center;">Made by JonathanDaCube • more features coming soon</p>

</body>
</html>
