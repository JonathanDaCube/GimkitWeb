<!DOCTYPE html>
<html>
<head>
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gimkit Community Web</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    #topNav { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
    #authNav { display:flex; gap:8px; align-items:center; }
    #activeGamesList, #activeMeetingsList, #scheduledMeetingsList { list-style: none; padding: 0; margin-top: 12px; }
    #activeGamesList li, #activeMeetingsList li, #scheduledMeetingsList li { background: #f3f4f6; border-radius: 6px; padding: 8px 12px; margin: 6px 0; display:flex; justify-content:space-between; }
    button { margin-left: 8px; }
    .small { font-size: 0.9rem; color: #555; }
    /* small auth form styles */
    #authForm { display:flex; gap:8px; align-items:center; margin:0; }
    #authForm input { padding:6px; border-radius:4px; border:1px solid #ccc; }
  </style>

  <!-- Firebase (compat for simpler example) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

<div id="topNav">
  <div id="authNav">
    <span id="userInfo" class="small" aria-live="polite"></span>

    <!-- Email / password sign-in form (same logic as admin) -->
    <form id="authForm" onsubmit="return false;">
      <input id="emailInput" type="email" placeholder="Email" required autocomplete="username" />
      <input id="passwordInput" type="password" placeholder="Password" required autocomplete="current-password" />
      <button id="signInBtn" type="button">Sign in</button>
      <button id="registerBtn" type="button">Register</button>
    </form>

    <button id="signOutBtn" type="button" style="display:none;">Sign out</button>
  </div>
</div>

<h1>Gimkit Community Website</h1>
<p class="small">Add and see active game codes and meetings in real-time (all visitors see updates instantly).</p>

<div>
  <h3>Active Games</h3>
  <ul id="activeGamesList" aria-live="polite"></ul>

  <label for="gameCodeInput" style="display:block; margin-top:8px;">Start your own game</label>
  <form id="gameForm" style="margin-top:8px;">
    <input id="gameCodeInput" type="text" placeholder="Enter game code" aria-label="Game code" required />
    <button type="submit">Start Game</button>
  </form>
</div>

<div style="margin-top:20px;">
  <h3>Active Meetings</h3>
  <ul id="activeMeetingsList" aria-live="polite"></ul>

  <label for="meetingInput" style="display:block; margin-top:8px;">Start your own meeting</label>
  <form id="meetingForm" style="margin-top:8px; display:inline-block;">
    <input id="meetingInput" type="text" placeholder="Enter meeting name or link" aria-label="Meeting" required />
    <button type="submit">Start Meeting</button>
  </form>
</div>
<div style="margin-top:20px;">
  <h3 for="scheduledMeets" style="display:block; margin-bottom:8px;">Scheduled Meetings</h3>

  <div style="margin-top:8px;">
    <label for="scheduleTitle" style="display:block; margin-bottom:4px;">Schedule a Meeting:</label>
    <form id="scheduleForm" style="display:flex; gap:8px; align-items:center;">
      <input id="scheduleTitle" type="text" placeholder="Meeting title" aria-label="Scheduled meeting title" required />
      <input id="scheduleTime" type="datetime-local" aria-label="Scheduled time" required />
      <button type="submit">Schedule</button>
    </form>
  </div>

  <ul id="scheduledMeetingsList" aria-live="polite"></ul>
</div>

<script>
  // ---------- REPLACE THIS WITH YOUR FIREBASE CONFIG ----------
  const firebaseConfig = {
    apiKey: "AIzaSyDq6eOzOWLd88XG-wFo0LN1O3l2Yyvdfls",
    authDomain: "gimkit-web.firebaseapp.com",
    databaseURL: "https://gimkit-web-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "gimkit-web",
    storageBucket: "gimkit-web.firebasedestorage.app",
    messagingSenderId: "192282058649",
    appId: "1:192282058649:web:cdcdfdb49c429fc0e33d08",
    measurementId: "G-TLCCKP056J"
  };
  // -----------------------------------------------------------

  // Initialize Firebase
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.database();
  const activeGamesRef = db.ref('activeGames');
  const activeMeetingsRef = db.ref('activeMeetings');
  const scheduledMeetingsRef = db.ref('scheduledMeetings');

  // --- Authentication UI ---
  const signInBtn = document.getElementById('signInBtn');
  const registerBtn = document.getElementById('registerBtn');
  const signOutBtn = document.getElementById('signOutBtn');
  const userInfo = document.getElementById('userInfo');
  const emailInput = document.getElementById('emailInput');
  const passwordInput = document.getElementById('passwordInput');

  function signInWithEmail() {
    const email = emailInput.value.trim();
    const password = passwordInput.value;
    if (!email || !password) { alert('Please enter email and password'); return; }
    auth.signInWithEmailAndPassword(email, password)
      .then((userCredential) => {
        console.log('Signed in:', userCredential.user.email);
      })
      .catch((err) => {
        console.error('Sign-in failed:', err);
        alert('Sign-in failed: ' + err.message);
      });
  }

  function registerWithEmail() {
    const email = emailInput.value.trim();
    const password = passwordInput.value;
    if (!email || !password) { alert('Please enter email and password'); return; }
    auth.createUserWithEmailAndPassword(email, password)
      .then((userCredential) => {
        console.log('Registered:', userCredential.user.email);
        alert('Registration successful. You are now signed in.');
      })
      .catch((err) => {
        console.error('Registration failed:', err);
        // If the email is already in use, try signing in with the provided password instead
        if (err && err.code === 'auth/email-already-in-use') {
          auth.signInWithEmailAndPassword(email, password)
            .then((userCredential) => {
              console.log('Existing user signed in via register flow:', userCredential.user.email);
              alert('Signed in successfully.');
            })
            .catch((signErr) => {
              console.error('Sign-in after registration failed:', signErr);
              // If sign-in fails (wrong password), surface the original registration error message where appropriate
              alert('Registration failed: ' + signErr.message);
            });
        } else {
          alert('Registration failed: ' + err.message);
        }
      });
  }

  function signOut() {
    auth.signOut().catch(err => console.error('Sign-out failed:', err));
  }

  // If no signed-in user, keep the site working anonymously.
  // Try to sign in anonymously once on load if there's no current user.
  if (!auth.currentUser) {
    auth.signInAnonymously().catch(err => console.error('Auth anonymous failed:', err));
  }

  // Listen for auth state changes
  auth.onAuthStateChanged(user => {
    if (!user) {
      userInfo.textContent = '';
      signInBtn.style.display = '';
      registerBtn.style.display = '';
      signOutBtn.style.display = 'none';
      emailInput.style.display = '';
      passwordInput.style.display = '';
      return;
    }

    if (user.isAnonymous) {
      userInfo.textContent = '(signed in anonymously)';
      signInBtn.style.display = '';
      registerBtn.style.display = '';
      signOutBtn.style.display = 'none';
    } else {
      const name = user.displayName || user.email || 'Signed in user';
      userInfo.textContent = 'Signed in as ' + name;
      signInBtn.style.display = 'none';
      registerBtn.style.display = 'none';
      emailInput.style.display = 'none';
      passwordInput.style.display = 'none';
      signOutBtn.style.display = '';
    }
  });

  signInBtn.addEventListener('click', signInWithEmail);
  registerBtn.addEventListener('click', registerWithEmail);
  signOutBtn.addEventListener('click', signOut);

  // --- Elements ---
  const gameForm = document.getElementById('gameForm');
  const gameCodeInput = document.getElementById('gameCodeInput');
  const activeGamesList = document.getElementById('activeGamesList');

  const meetingForm = document.getElementById('meetingForm');
  const meetingInput = document.getElementById('meetingInput');
  const activeMeetingsList = document.getElementById('activeMeetingsList');

  const scheduleForm = document.getElementById('scheduleForm');
  const scheduleTitle = document.getElementById('scheduleTitle');
  const scheduleTime = document.getElementById('scheduleTime');
  const scheduledMeetingsList = document.getElementById('scheduledMeetingsList');

  // Local mapping of DB keys -> list items
  const listItems = {};
  const meetingItems = {};
  const scheduledItems = {};

  function formatDate(ts) {
    const d = new Date(ts);
    return d.toLocaleString();
  }

  // --- Game submit ---
  gameForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const raw = gameCodeInput.value.trim();
    if (!raw) return;
    const code = raw.toUpperCase().replace(/\s+/g, '');
    activeGamesRef.orderByChild('code').equalTo(code).once('value', snap => {
      if (snap.exists()) {
        gameCodeInput.value = '';
        gameCodeInput.focus();
        return;
      }
      const newRef = activeGamesRef.push();
      newRef.set({ code, createdAt: Date.now() }).catch(err => {
        console.error('Write failed (games):', err);
      });
      gameCodeInput.value = '';
      gameCodeInput.focus();
    });
  });

  // --- Active meeting submit ---
  meetingForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const raw = meetingInput.value.trim();
    if (!raw) return;
    const titleOrLink = raw;
    const isUrl = /https?:\/\//i.test(titleOrLink);
    const payload = { title: titleOrLink, createdAt: Date.now() };
    if (isUrl) payload.link = titleOrLink;

    const newRef = activeMeetingsRef.push();
    newRef.set(payload).catch(err => console.error('Write failed (active meeting):', err));

    meetingInput.value = '';
    meetingInput.focus();
  });

  // --- Schedule a meeting ---
  scheduleForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const title = scheduleTitle.value.trim();
    const when = scheduleTime.value;
    if (!title || !when) return;
    const scheduledAt = new Date(when).getTime();
    const newRef = scheduledMeetingsRef.push();
    newRef.set({ title, scheduledAt, createdAt: Date.now() })
      .then(() => {
        scheduleTitle.value = '';
        scheduleTime.value = '';
      })
      .catch(err => console.error('Write failed (schedule):', err));
  });

  // --- Active games UI listeners ---
  activeGamesRef.on('child_added', snapshot => {
    const key = snapshot.key;
    const val = snapshot.val();
    if (!val || !val.code) return;
    const li = document.createElement('li');
    const text = document.createElement('span');
    text.textContent = val.code;
    const btns = document.createElement('span');

    const removeBtn = document.createElement('button');
    removeBtn.textContent = 'Remove';
    removeBtn.type = 'button';
    removeBtn.addEventListener('click', () => activeGamesRef.child(key).remove());

    btns.appendChild(removeBtn);
    li.appendChild(text);
    li.appendChild(btns);

    listItems[key] = li;
    activeGamesList.appendChild(li);
  });

  activeGamesRef.on('child_removed', snapshot => {
    const key = snapshot.key;
    const li = listItems[key];
    if (li && li.parentNode) li.parentNode.removeChild(li);
    delete listItems[key];
  });

  activeGamesRef.on('value', snapshot => {
    const items = [];
    snapshot.forEach(child => {
      const v = child.val();
      if (v && v.code) items.push({ key: child.key, code: v.code, createdAt: v.createdAt || 0 });
    });
    items.sort((a, b) => a.createdAt - b.createdAt);
    activeGamesList.innerHTML = '';
    items.forEach(item => {
      const li = document.createElement('li');
      const text = document.createElement('span');
      text.textContent = item.code;
      const removeBtn = document.createElement('button');
      removeBtn.textContent = 'Remove';
      removeBtn.type = 'button';
      removeBtn.addEventListener('click', () => activeGamesRef.child(item.key).remove());
      li.appendChild(text);
      li.appendChild(removeBtn);
      activeGamesList.appendChild(li);
      listItems[item.key] = li;
    });
  });

  // --- Active meetings UI listeners ---
  activeMeetingsRef.on('child_added', snapshot => {
    const key = snapshot.key;
    const val = snapshot.val();
    if (!val || !val.title) return;
    const li = document.createElement('li');
    const left = document.createElement('span');
    left.textContent = val.title;

    if (val.link) {
      const join = document.createElement('a');
      join.href = val.link;
      join.textContent = 'Join';
      join.target = '_blank';
      join.style.marginRight = '8px';
      left.appendChild(document.createTextNode(' '));
      left.appendChild(join);
    }

    const removeBtn = document.createElement('button');
    removeBtn.textContent = 'Remove';
    removeBtn.type = 'button';
    removeBtn.addEventListener('click', () => activeMeetingsRef.child(key).remove());

    li.appendChild(left);
    li.appendChild(removeBtn);

    meetingItems[key] = li;
    activeMeetingsList.appendChild(li);
  });

  activeMeetingsRef.on('child_removed', snapshot => {
    const key = snapshot.key;
    const li = meetingItems[key];
    if (li && li.parentNode) li.parentNode.removeChild(li);
    delete meetingItems[key];
  });

  activeMeetingsRef.on('value', snapshot => {
    const items = [];
    snapshot.forEach(child => {
      const v = child.val();
      if (v && v.title) items.push({ key: child.key, title: v.title, link: v.link, createdAt: v.createdAt || 0 });
    });
    items.sort((a, b) => a.createdAt - b.createdAt);
    activeMeetingsList.innerHTML = '';
    items.forEach(item => {
      const li = document.createElement('li');
      const left = document.createElement('span');
      left.textContent = item.title;
      if (item.link) {
        const join = document.createElement('a');
        join.href = item.link;
        join.textContent = 'Join';
        join.target = '_blank';
        join.style.marginRight = '8px';
        left.appendChild(document.createTextNode(' '));
        left.appendChild(join);
      }
      const removeBtn = document.createElement('button');
      removeBtn.textContent = 'Remove';
      removeBtn.type = 'button';
      removeBtn.addEventListener('click', () => activeMeetingsRef.child(item.key).remove());
      li.appendChild(left);
      li.appendChild(removeBtn);
      activeMeetingsList.appendChild(li);
      meetingItems[item.key] = li;
    });
  });

  // --- Scheduled meetings UI listeners (same format as the others) ---
  scheduledMeetingsRef.on('child_added', snapshot => {
    const key = snapshot.key;
    const val = snapshot.val();
    if (!val || !val.title) return;

    const li = document.createElement('li');
    const text = document.createElement('span');
    text.textContent = `${val.title} (${formatDate(val.scheduledAt)})`;

    const btns = document.createElement('span');
    const addLinkBtn = document.createElement('button');
    addLinkBtn.textContent = 'Add link / Activate';
    addLinkBtn.type = 'button';
    addLinkBtn.addEventListener('click', async () => {
      const link = prompt('Enter meeting link (https://...) for "' + val.title + '"');
      if (!link) return;
      const newRef = activeMeetingsRef.push();
      await newRef.set({ title: val.title, link, scheduledAt: val.scheduledAt, createdAt: Date.now() }).catch(err => console.error('Activate failed:', err));
      scheduledMeetingsRef.child(key).remove().catch(err => console.error('Failed to remove scheduled:', err));
    });

    const removeBtn = document.createElement('button');
    removeBtn.textContent = 'Remove';
    removeBtn.type = 'button';
    removeBtn.addEventListener('click', () => scheduledMeetingsRef.child(key).remove());

    btns.appendChild(addLinkBtn);
    btns.appendChild(removeBtn);

    li.appendChild(text);
    li.appendChild(btns);

    scheduledItems[key] = li;
    scheduledMeetingsList.appendChild(li);
  });

  scheduledMeetingsRef.on('child_removed', snapshot => {
    const key = snapshot.key;
    const li = scheduledItems[key];
    if (li && li.parentNode) li.parentNode.removeChild(li);
    delete scheduledItems[key];
  });

  scheduledMeetingsRef.on('value', snapshot => {
    const items = [];
    snapshot.forEach(child => {
      const v = child.val();
      if (v && v.title) items.push({ key: child.key, title: v.title, scheduledAt: v.scheduledAt || 0, createdAt: v.createdAt || 0 });
    });
    items.sort((a, b) => a.scheduledAt - b.scheduledAt);
    scheduledMeetingsList.innerHTML = '';
    items.forEach(item => {
      const li = document.createElement('li');
      const text = document.createElement('span');
      text.textContent = `${item.title} (${formatDate(item.scheduledAt)})`;

      const btns = document.createElement('span');
      const addLinkBtn = document.createElement('button');
      addLinkBtn.textContent = 'Add link / Activate';
      addLinkBtn.type = 'button';
      addLinkBtn.addEventListener('click', async () => {
        const link = prompt('Enter meeting link (https://...) for "' + item.title + '"');
        if (!link) return;
        const newRef = activeMeetingsRef.push();
        await newRef.set({ title: item.title, link, scheduledAt: item.scheduledAt, createdAt: Date.now() }).catch(err => console.error('Activate failed:', err));
        scheduledMeetingsRef.child(item.key).remove().catch(err => console.error('Failed to remove scheduled:', err));
      });

      const removeBtn = document.createElement('button');
      removeBtn.textContent = 'Remove';
      removeBtn.type = 'button';
      removeBtn.addEventListener('click', () => scheduledMeetingsRef.child(item.key).remove());

      btns.appendChild(addLinkBtn);
      btns.appendChild(removeBtn);

      li.appendChild(text);
      li.appendChild(btns);
      scheduledMeetingsList.appendChild(li);
      scheduledItems[item.key] = li;
    });
  });
</script>

<p class="small" style="margin-top: 30px; text-align: center;">Made by JonathanDaCube • More Features Coming Soon • <a href="https://jonathanlam0820.github.io/GimkitWeb/admin">Admin Mode</a></p>

</body>
</html>
