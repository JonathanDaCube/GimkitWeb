<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign up — Gimkit Community</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 24px;
      max-width: 600px;
      margin: 0 auto;
    }
    h1 { margin-top: 12px; }
    form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 12px;
    }
    input {
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 1rem;
    }
    button {
      padding: 10px 14px;
      border-radius: 6px;
      border: none;
      background: #28a745;
      color: white;
      cursor: pointer;
      font-size: 1rem;
    }
    .error {
      color: #b33;
      min-height: 20px;
    }
    .small {
      font-size: 0.9rem;
      color: #555;
    }
  </style>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>
  <a href="/GimkitWeb/">← Back to site</a>
  <h1>Create account</h1>

  <form id="signUpForm" onsubmit="return false;">
    <input id="username" type="text" placeholder="Username" required autocomplete="nickname" />
    <input id="email" type="email" placeholder="Email" required autocomplete="username" />
    <input id="password" type="password" placeholder="Password" required autocomplete="new-password" />
    <button id="signUpBtn" type="button">Create account</button>
    <div id="errorMsg" class="error" role="alert" aria-live="polite"></div>
  </form>

  <p class="small">Already have an account? <a href="/GimkitWeb/signIn.html">Sign in</a></p>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDq6eOzOWLd88XG-wFo0LN1O3l2Yyvdfls",
      authDomain: "gimkit-web.firebaseapp.com",
      databaseURL: "https://gimkit-web-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "gimkit-web",
      storageBucket: "gimkit-web.firebasestorage.app",
      messagingSenderId: "192282058649",
      appId: "1:192282058649:web:cdcdfdb49c429fc0e33d08",
      measurementId: "G-TLCCKP056J"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    const usernameEl = document.getElementById('username');
    const emailEl = document.getElementById('email');
    const passwordEl = document.getElementById('password');
    const signUpBtn = document.getElementById('signUpBtn');
    const errorMsg = document.getElementById('errorMsg');

    function showError(msg) {
      errorMsg.textContent = msg || '';
    }

    function saveProfile(uid, username, email) {
      return db.ref('users/' + uid).set({
        username: username,
        email: email,
        createdAt: Date.now()
      });
    }

    signUpBtn.addEventListener('click', () => {
      showError('');
      const username = usernameEl.value.trim();
      const email = emailEl.value.trim();
      const password = passwordEl.value;

      if (!username || !email || !password) {
        showError('Please complete all fields.');
        return;
      }

      auth.createUserWithEmailAndPassword(email, password)
        .then((userCredential) => {
          const user = userCredential.user;
          if (user && user.updateProfile) {
            user.updateProfile({ displayName: username }).catch(err => console.warn('updateProfile failed:', err));
          }

          return saveProfile(user.uid, username, email)
            .then(() => {
              window.location.href = '/GimkitWeb/';
            });
        })
        .catch((err) => {
          console.error('Sign-up failed:', err);
          if (err && err.code === 'auth/email-already-in-use') {
            auth.signInWithEmailAndPassword(email, password)
              .then(() => {
                window.location.href = '/GimkitWeb/';
              })
              .catch(signErr => {
                console.error('Sign-in after email-in-use failed:', signErr);
                showError(signErr.message || 'Email already exists; sign-in failed.');
              });
          } else {
            showError(err.message || 'Sign-up failed.');
          }
        });
    });
  </script>
</body>
</html>
