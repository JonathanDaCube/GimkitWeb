<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Owner Mode — Gimkit Community</title>
  <link rel="stylesheet" href="/GimkitWeb/site-nav.css" />
  <script src="/GimkitWeb/site-nav.js" defer></script>
  <style>
    body { font-family: Arial, sans-serif; }
    .section { background:#f8fafc; border-radius:8px; padding:16px; margin:16px 0; }
    #adminSearch { box-sizing:border-box; width:100%; max-width:520px; padding:10px; }
    #adminSearchResults, #adminList { padding:0; list-style:none; }
    #adminSearchResults li, #adminList li { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid #ddd; }
    #adminWorkspace { width:100%; height:75vh; min-height:600px; border:1px solid #ddd; border-radius:8px; background:white; }
    .small { color:#555; font-size:.9rem; }
    .admin-user-detail { overflow-wrap:anywhere; }
  </style>
</head>
<body>
  <div id="ownerAuth">
    <span id="ownerUserInfo" class="small" aria-live="polite"></span>
    <form id="ownerAuthForm" onsubmit="return false;">
      <input id="ownerLoginEmail" type="email" placeholder="Email" autocomplete="username" required />
      <input id="ownerLoginPassword" type="password" placeholder="Password" autocomplete="current-password" required />
      <button id="ownerEmailSignIn" type="button">Sign in</button>
      <button id="ownerGoogleSignIn" type="button">Sign in with Google</button>
    </form>
    <button id="ownerSignOut" type="button" hidden>Sign out</button>
  </div>
  <section id="googleExtra" class="section" hidden>
    <h2>Finish setting up your account</h2>
    <p class="small">Choose a username and password to use with <span id="googleEmail"></span>.</p>
    <input id="linkUsername" type="text" placeholder="Username" autocomplete="nickname" />
    <input id="linkPassword" type="password" placeholder="Password" autocomplete="new-password" />
    <input id="linkPasswordConfirm" type="password" placeholder="Confirm password" autocomplete="new-password" />
    <button id="linkBtn" type="button">Complete account</button>
    <button id="linkCancel" type="button">Cancel</button>
    <p id="linkError" class="small" role="alert" aria-live="polite"></p>
  </section>
  <h1>Owner Mode</h1>
  <p id="ownerAccessMessage" class="small" role="status" aria-live="polite">Sign in with the owner account to access Owner Mode.</p>

  <main id="ownerContent" hidden>
    <section class="section" aria-labelledby="adminManagementHeading">
      <h2 id="adminManagementHeading">Manage admins</h2>
      <p class="small">Search accounts registered on this site by username or email, then give or revoke admin access.</p>
      <label for="adminSearch">Search users</label>
      <input id="adminSearch" type="search" placeholder="Enter an email or username" autocomplete="off" />
      <p id="adminSearchStatus" class="small" role="status" aria-live="polite"></p>
      <ul id="adminSearchResults" aria-label="User search results"></ul>
      <h3>Current admins</h3>
      <p id="adminListStatus" class="small" role="status" aria-live="polite"></p>
      <ul id="adminList"></ul>
    </section>

    <section class="section" aria-labelledby="adminWorkspaceHeading">
      <h2 id="adminWorkspaceHeading">Admin settings</h2>
      <iframe id="adminWorkspace" title="Admin Mode settings"></iframe>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDq6eOzOWLd88XG-wFo0LN1O3l2Yyvdfls",
      authDomain: "gimkit-web.firebaseapp.com",
      databaseURL: "https://gimkit-web-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "gimkit-web",
      storageBucket: "gimkit-web.firebasedestorage.app",
      messagingSenderId: "192282058649",
      appId: "1:192282058649:web:cdcdfdb49c429fc0e33d08",
      measurementId: "G-TLCCKP056J"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();
    auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL)
      .catch(error => console.warn('Could not set authentication persistence:', error));
    const adminsRef = db.ref('admins');
    const usersRef = db.ref('users');
    const ownerEmail = 'jonathanlam0820@gmail.com';
    const ownerUserInfo = document.getElementById('ownerUserInfo');
    const ownerLoginEmail = document.getElementById('ownerLoginEmail');
    const ownerLoginPassword = document.getElementById('ownerLoginPassword');
    const ownerEmailSignIn = document.getElementById('ownerEmailSignIn');
    const ownerGoogleSignIn = document.getElementById('ownerGoogleSignIn');
    const ownerSignOut = document.getElementById('ownerSignOut');
    const googleExtra = document.getElementById('googleExtra');
    const googleEmail = document.getElementById('googleEmail');
    const linkUsername = document.getElementById('linkUsername');
    const linkPassword = document.getElementById('linkPassword');
    const linkPasswordConfirm = document.getElementById('linkPasswordConfirm');
    const linkBtn = document.getElementById('linkBtn');
    const linkCancel = document.getElementById('linkCancel');
    const linkError = document.getElementById('linkError');
    const ownerContent = document.getElementById('ownerContent');
    const ownerAccessMessage = document.getElementById('ownerAccessMessage');
    const adminSearch = document.getElementById('adminSearch');
    const adminSearchStatus = document.getElementById('adminSearchStatus');
    const adminSearchResults = document.getElementById('adminSearchResults');
    const adminList = document.getElementById('adminList');
    const adminListStatus = document.getElementById('adminListStatus');
    const adminWorkspace = document.getElementById('adminWorkspace');
    let isOwner = false;
    let adminListListenerAttached = false;
    let adminListLoaded = false;
    let adminListLoadFailed = false;
    let userDirectoryLoaded = false;
    let userDirectory = [];
    let adminUids = new Set();
    let authStateChangeId = 0;

    function setOwnerAccess(allowed) {
      isOwner = allowed;
      ownerContent.hidden = !allowed;
    }

    ownerEmailSignIn.addEventListener('click', () => {
      auth.signInWithEmailAndPassword(ownerLoginEmail.value.trim(), ownerLoginPassword.value)
        .catch(error => {
          console.error('Owner sign-in failed:', error);
          ownerAccessMessage.textContent = error.message || 'Sign-in failed.';
        });
    });

    ownerGoogleSignIn.addEventListener('click', () => {
      auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())
        .then(result => {
          if (!result.additionalUserInfo || !result.additionalUserInfo.isNewUser) return;
          googleEmail.textContent = result.user.email || '';
          linkUsername.value = result.user.displayName || '';
          linkPassword.value = '';
          linkPasswordConfirm.value = '';
          linkError.textContent = '';
          googleExtra.hidden = false;
        })
        .catch(error => {
          console.error('Owner Google sign-in failed:', error);
          ownerAccessMessage.textContent = error.message || 'Google sign-in failed.';
        });
    });

    linkCancel.addEventListener('click', () => {
      googleExtra.hidden = true;
      linkError.textContent = '';
      if (auth.currentUser) {
        auth.signOut().catch(error => console.error('Sign-out after account setup cancellation failed:', error));
      }
    });

    linkBtn.addEventListener('click', async () => {
      const username = linkUsername.value.trim();
      const password = linkPassword.value;
      const passwordConfirm = linkPasswordConfirm.value;
      const email = googleEmail.textContent.trim();
      if (!username || !password) {
        linkError.textContent = 'Enter a username and password.';
        return;
      }
      if (password !== passwordConfirm) {
        linkError.textContent = 'Passwords do not match.';
        return;
      }
      if (!auth.currentUser) {
        linkError.textContent = 'No authenticated user. Please sign in with Google again.';
        return;
      }

      linkBtn.disabled = true;
      linkError.textContent = '';
      try {
        const user = auth.currentUser;
        const alreadyLinked = user.providerData.some(provider => provider.providerId === 'password');
        const linkedUser = alreadyLinked
          ? user
          : (await user.linkWithCredential(
            firebase.auth.EmailAuthProvider.credential(email, password)
          )).user;
        await linkedUser.updateProfile({ displayName: username });
        await usersRef.child(linkedUser.uid).set({
          username,
          email: email.toLowerCase(),
          createdAt: Date.now()
        });
        window.location.reload();
      } catch (error) {
        console.error('Owner Google account setup failed:', error);
        linkError.textContent = error.code === 'auth/email-already-in-use'
          ? 'That email is already in use with another account. Try signing in with email and password.'
          : error.message || 'Could not complete account setup.';
        linkBtn.disabled = false;
      }
    });

    ownerSignOut.addEventListener('click', () => {
      auth.signOut().catch(error => console.error('Owner sign-out failed:', error));
    });

    function renderAdmins(snapshot) {
      adminList.replaceChildren();
      const records = [];
      adminListLoaded = true;
      adminListLoadFailed = false;
      adminUids = new Set();
      snapshot.forEach(child => {
        const record = child.val();
        if (record && record.email) {
          records.push({ uid: child.key, email: record.email });
          adminUids.add(child.key);
        }
      });
      records.sort((a, b) => a.email.localeCompare(b.email));

      if (records.length === 0) {
        const emptyItem = document.createElement('li');
        emptyItem.textContent = 'No additional admins have been added.';
        adminList.appendChild(emptyItem);
        return;
      }

      records.forEach(record => {
        const item = document.createElement('li');
        const detail = document.createElement('span');
        detail.textContent = `${record.email} (${record.uid})`;
        const removeButton = document.createElement('button');
        removeButton.type = 'button';
        removeButton.textContent = 'Revoke admin access';
        removeButton.setAttribute('aria-label', `Revoke admin access for ${record.email}`);
        removeButton.addEventListener('click', async () => {
          if (!isOwner || !confirm(`Remove admin access for ${record.email}?`)) return;
          try {
            await adminsRef.child(record.uid).remove();
            adminListStatus.textContent = `Revoked admin access for ${record.email}.`;
          } catch (error) {
            console.error('Could not remove admin:', error);
            adminListStatus.textContent = 'Could not remove admin. Check the database rules and try again.';
          }
        });
        item.append(detail, removeButton);
        adminList.appendChild(item);
      });
      renderUserSearchResults();
    }

    function renderUserSearchResults() {
      adminSearchResults.replaceChildren();
      const query = adminSearch.value.trim().toLowerCase();
      if (!query) {
        adminSearchStatus.textContent = 'Enter an email or username to find an account.';
        return;
      }
      if (!userDirectoryLoaded) {
        adminSearchStatus.textContent = 'Loading registered users...';
        return;
      }
      if (adminListLoadFailed) {
        adminSearchStatus.textContent = 'Could not load current admin access. Refresh before changing access.';
        return;
      }
      if (!adminListLoaded) {
        adminSearchStatus.textContent = 'Loading current admin access...';
        return;
      }

      const matches = userDirectory
        .filter(user =>
          (user.username && user.username.toLowerCase().includes(query)) ||
          (user.email && user.email.toLowerCase().includes(query))
        )
        .sort((a, b) => (a.username || a.email).localeCompare(b.username || b.email))
        .slice(0, 20);

      if (matches.length === 0) {
        adminSearchStatus.textContent = 'No registered users matched your search.';
        return;
      }
      adminSearchStatus.textContent = matches.length === 20
        ? 'Showing the first 20 matches. Refine your search to narrow the results.'
        : `${matches.length} matching ${matches.length === 1 ? 'user' : 'users'}.`;

      matches.forEach(user => {
        const item = document.createElement('li');
        const detail = document.createElement('span');
        detail.className = 'admin-user-detail';
        detail.textContent = user.username
          ? `${user.username} (${user.email || 'No email'})`
          : user.email || 'Unnamed user';
        const accessButton = document.createElement('button');
        accessButton.type = 'button';
        const isAdmin = adminUids.has(user.uid);
        const isOwnerAccount = user.email.toLowerCase() === ownerEmail;
        accessButton.textContent = isOwnerAccount
          ? 'Owner account'
          : isAdmin ? 'Revoke admin access' : 'Give admin access';
        accessButton.setAttribute('aria-label', isOwnerAccount
          ? 'Owner account already has owner access'
          : `${isAdmin ? 'Revoke' : 'Give'} admin access ${isAdmin ? 'for' : 'to'} ${user.email || user.username}`);
        accessButton.disabled = isOwnerAccount || !user.email;
        accessButton.addEventListener('click', async () => {
          if (!isOwner || !user.email || isOwnerAccount) return;
          if (adminUids.has(user.uid)) {
            if (!confirm(`Revoke admin access for ${user.email}?`)) return;
          }

          accessButton.disabled = true;
          try {
            if (adminUids.has(user.uid)) {
              await adminsRef.child(user.uid).remove();
              adminListStatus.textContent = `Revoked admin access for ${user.email}.`;
            } else {
              await adminsRef.child(user.uid).set({
                email: user.email.toLowerCase(),
                addedAt: Date.now()
              });
              adminListStatus.textContent = `Granted admin access to ${user.email}. They must sign in with this verified email to use Admin Mode.`;
            }
          } catch (error) {
            console.error('Could not update admin access:', error);
            adminListStatus.textContent = 'Could not update admin access. Check the database rules and try again.';
            accessButton.disabled = false;
          }
        });
        item.append(detail, accessButton);
        adminSearchResults.appendChild(item);
      });
    }

    adminSearch.addEventListener('input', renderUserSearchResults);

    auth.onAuthStateChanged(async user => {
      const stateChangeId = ++authStateChangeId;
      setOwnerAccess(false);
      if (!user) {
        ownerUserInfo.textContent = '';
        ownerLoginEmail.style.display = '';
        ownerLoginPassword.style.display = '';
        ownerEmailSignIn.style.display = '';
        ownerGoogleSignIn.style.display = '';
        ownerSignOut.hidden = true;
      } else {
        ownerUserInfo.textContent = `Signed in as ${user.displayName || user.email || 'user'}`;
        ownerLoginEmail.style.display = 'none';
        ownerLoginPassword.style.display = 'none';
        ownerEmailSignIn.style.display = 'none';
        ownerGoogleSignIn.style.display = 'none';
        ownerSignOut.hidden = false;
      }
      if (!user) {
        ownerAccessMessage.textContent = 'Sign in with the owner account to access Owner Mode.';
        return;
      }

      const authorized = Boolean(
        !user.isAnonymous &&
        user.emailVerified &&
        user.email &&
        user.email.toLowerCase() === ownerEmail
      );
      if (!authorized) {
        ownerAccessMessage.textContent = 'Not authorized for Owner Mode.';
        return;
      }
      if (stateChangeId !== authStateChangeId) return;

      ownerAccessMessage.textContent = '';
      setOwnerAccess(true);
      if (!userDirectoryLoaded) {
        try {
          const usersSnapshot = await usersRef.once('value');
          if (stateChangeId !== authStateChangeId) return;
          userDirectory = [];
          usersSnapshot.forEach(child => {
            const profile = child.val();
            if (profile && (profile.email || profile.username)) {
              userDirectory.push({
                uid: child.key,
                email: typeof profile.email === 'string' ? profile.email.trim() : '',
                username: typeof profile.username === 'string' ? profile.username.trim() : ''
              });
            }
          });
          userDirectoryLoaded = true;
          renderUserSearchResults();
        } catch (error) {
          if (stateChangeId !== authStateChangeId) return;
          console.error('Could not load registered users:', error);
          adminSearchStatus.textContent = 'Could not load users. Check the database rules and try again.';
        }
      }
      if (!adminWorkspace.dataset.loaded) {
        adminWorkspace.dataset.loaded = 'true';
        adminWorkspace.src = '/GimkitWeb/admin/?embedded=1';
      }
      if (!adminListListenerAttached) {
        adminListListenerAttached = true;
        adminsRef.on('value', renderAdmins, error => {
          console.error('Could not load admin list:', error);
          adminListLoadFailed = true;
          renderUserSearchResults();
          adminListStatus.textContent = 'Could not load admins. Check the database rules and try again.';
        });
      }
    }, error => {
      console.error('Could not determine owner access:', error);
      ownerAccessMessage.textContent = 'Could not verify Owner Mode access. Please refresh and try again.';
    });
  </script>
</body>
</html>
