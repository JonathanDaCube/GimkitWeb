<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="/GimkitWeb/icon.svg" />
  <title>Notification Settings — Gimkit Community</title>
  <link rel="stylesheet" href="/GimkitWeb/site-nav.css" />
  <link rel="stylesheet" href="/GimkitWeb/buttons.css" />
  <script src="/GimkitWeb/site-nav.js" defer></script>
  <style>
    body { font-family: Arial, sans-serif; padding: 24px; }
    .settings-panel { max-width: 720px; margin: 20px 0; padding: 16px; border: 1px solid #ddd; border-radius: 8px; }
    .settings-panel label { display: flex; gap: 10px; align-items: flex-start; margin: 14px 0; }
    .settings-panel input[type="checkbox"] { margin-top: 3px; }
    .small { color: #555; font-size: .9rem; }
    #settingsStatus { min-height: 1.4em; }
    #notificationSettings[hidden] { display: none; }
  </style>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-messaging-compat.js"></script>
</head>
<body>
  <main>
    <h1>Notification settings</h1>
    <p id="settingsStatus" class="small" role="status" aria-live="polite">Checking your sign-in…</p>
    <section id="notificationSettings" class="settings-panel" hidden aria-labelledby="notificationHeading">
      <h2 id="notificationHeading">Browser notifications</h2>
      <p class="small">Notifications can arrive while the site is closed after you enable them and allow notifications in your browser.</p>
      <button id="enableNotifications" class="primary-button" type="button">Enable browser notifications</button>
      <p id="permissionStatus" class="small" role="status" aria-live="polite"></p>

      <h3>Notification types</h3>
      <label><input id="gameStarted" type="checkbox" checked /> <span>When a game starts <span class="small">(on by default)</span></span></label>
      <label><input id="meetingStarted" type="checkbox" checked /> <span>When a meeting starts <span class="small">(on by default)</span></span></label>
      <label><input id="meetingStartingSoon" type="checkbox" checked /> <span>Five minutes before a scheduled event <span class="small">(on by default)</span></span></label>
      <label id="scorePendingOption" hidden><input id="scorePending" type="checkbox" /> <span>When a score is submitted for review <span class="small">(admins only, off by default)</span></span></label>
      <label><input id="newNews" type="checkbox" /> <span>When new news is published <span class="small">(off by default)</span></span></label>
    </section>
  </main>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDq6eOzOWLd88XG-wFo0LN1O3l2Yyvdfls",
      authDomain: "gimkit-web.firebaseapp.com",
      databaseURL: "https://gimkit-web-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "gimkit-web",
      storageBucket: "gimkit-web.firebasestorage.app",
      messagingSenderId: "192282058649",
      appId: "1:192282058649:web:cdcdfdb49c429fc0e33d08",
      measurementId: "G-TLCCKP056J"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();
    auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL)
      .catch(error => console.error('Could not set authentication persistence:', error));

    const settingsStatus = document.getElementById('settingsStatus');
    const notificationSettings = document.getElementById('notificationSettings');
    const permissionStatus = document.getElementById('permissionStatus');
    const enableNotificationsButton = document.getElementById('enableNotifications');
    const scorePendingOption = document.getElementById('scorePendingOption');
    const preferenceDefaults = {
      gameStarted: true,
      meetingStarted: true,
      meetingStartingSoon: true,
      scorePending: false,
      newNews: false
    };
    const preferenceKeys = Object.keys(preferenceDefaults);
    let signedInUser = null;
    let userIsAdmin = false;
    let saveSequence = 0;
    let preferenceWrites = Promise.resolve();

    function renderPermissionStatus() {
      if (!('Notification' in window)) {
        permissionStatus.textContent = 'This browser does not support web notifications.';
        enableNotificationsButton.disabled = true;
      } else if (Notification.permission === 'granted') {
        permissionStatus.textContent = 'Browser notifications are allowed.';
        enableNotificationsButton.disabled = false;
      } else if (Notification.permission === 'denied') {
        permissionStatus.textContent = 'Notifications are blocked by your browser. Change this site’s notification permission in browser settings to enable them.';
        enableNotificationsButton.disabled = true;
      } else {
        permissionStatus.textContent = 'Allow browser notifications to receive alerts while the site is closed.';
        enableNotificationsButton.disabled = false;
      }
    }

    async function savePreferences() {
      if (!signedInUser) return;
      const currentSequence = ++saveSequence;
      const preferences = {};
      preferenceKeys.forEach(key => {
        preferences[key] = key === 'scorePending' && !userIsAdmin
          ? false
          : document.getElementById(key).checked;
      });
      try {
        const uid = signedInUser.uid;
        const write = preferenceWrites.catch(() => {}).then(() =>
          db.ref(`notificationPreferences/${uid}`).set(preferences)
        );
        preferenceWrites = write;
        await write;
        if (currentSequence === saveSequence) settingsStatus.textContent = 'Notification preferences saved.';
      } catch (error) {
        console.error('Could not save notification preferences:', error);
        if (currentSequence === saveSequence) settingsStatus.textContent = 'Could not save settings. Check your account and database rules.';
      }
    }

    async function registerPushToken(user) {
      const registration = await navigator.serviceWorker.register('/GimkitWeb/firebase-messaging-sw.js', { scope: '/GimkitWeb/' });
      const messaging = firebase.messaging();
      const token = await messaging.getToken({ serviceWorkerRegistration: registration });
      if (!token) throw new Error('Firebase did not return a push token.');
      if (!auth.currentUser || auth.currentUser.uid !== user.uid) {
        throw new Error('The signed-in account changed while enabling notifications.');
      }
      const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(token));
      const tokenHash = Array.from(new Uint8Array(digest), byte => byte.toString(16).padStart(2, '0')).join('');
      await db.ref(`notificationTokens/${user.uid}/${tokenHash}`).set(token);
    }

    async function enableBrowserNotifications() {
      if (!signedInUser || signedInUser.isAnonymous || !signedInUser.emailVerified) {
        permissionStatus.textContent = 'Sign in with a verified account to enable notifications.';
        return;
      }
      if (!('Notification' in window) || !('serviceWorker' in navigator)) {
        permissionStatus.textContent = 'This browser does not support Firebase push notifications.';
        return;
      }
      enableNotificationsButton.disabled = true;
      try {
        const permission = await Notification.requestPermission();
        renderPermissionStatus();
        if (permission !== 'granted') return;
        if (!await firebase.messaging.isSupported()) {
          permissionStatus.textContent = 'This browser does not support Firebase push notifications.';
          return;
        }

        await registerPushToken(signedInUser);
        await savePreferences();
        permissionStatus.textContent = 'Browser notifications are enabled for this device.';
      } catch (error) {
        console.error('Could not enable browser notifications:', error);
        permissionStatus.textContent = 'Could not enable notifications. Make sure notifications are allowed and try again.';
      } finally {
        enableNotificationsButton.disabled = 'Notification' in window && Notification.permission === 'denied';
      }
    }

    enableNotificationsButton.addEventListener('click', enableBrowserNotifications);
    preferenceKeys.forEach(key => {
      document.getElementById(key).addEventListener('change', savePreferences);
    });
    renderPermissionStatus();

    let authStateChangeId = 0;
    auth.onAuthStateChanged(async user => {
      const stateChangeId = ++authStateChangeId;
      signedInUser = user && !user.isAnonymous && user.emailVerified ? user : null;
      userIsAdmin = false;
      notificationSettings.hidden = true;
      scorePendingOption.hidden = true;
      if (!signedInUser) {
        settingsStatus.textContent = user && !user.isAnonymous
          ? 'Verify your email address to manage notification settings.'
          : 'Sign in to manage notification settings.';
        return;
      }

      try {
        const [adminSnapshot, preferenceSnapshot] = await Promise.all([
          db.ref(`admins/${user.uid}`).once('value'),
          db.ref(`notificationPreferences/${user.uid}`).once('value')
        ]);
        if (stateChangeId !== authStateChangeId) return;
        const admin = adminSnapshot.val();
        userIsAdmin = user.email.toLowerCase() === 'jonathanlam0820@gmail.com' ||
          Boolean(admin && admin.email === user.email.toLowerCase());
        scorePendingOption.hidden = !userIsAdmin;

        const saved = preferenceSnapshot.val() || {};
        preferenceKeys.forEach(key => {
          document.getElementById(key).checked = key === 'scorePending' && !userIsAdmin
            ? false
            : typeof saved[key] === 'boolean' ? saved[key] : preferenceDefaults[key];
        });
        notificationSettings.hidden = false;
        settingsStatus.textContent = `Settings for ${user.displayName || user.email}.`;
        if ('Notification' in window && Notification.permission === 'granted' &&
            await firebase.messaging.isSupported()) {
          try {
            await registerPushToken(user);
          } catch (error) {
            console.error('Could not refresh the browser notification token:', error);
            permissionStatus.textContent = 'Could not refresh notifications for this device. Use the enable button to retry.';
          }
        }
      } catch (error) {
        console.error('Could not load notification settings:', error);
        if (stateChangeId === authStateChangeId) {
          settingsStatus.textContent = 'Could not load notification settings. Check your account and try again.';
        }
      }
    });
  </script>
  <script src="/GimkitWeb/notifications.js"></script>
</body>
</html>
