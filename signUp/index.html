<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="/GimkitWeb/icon.svg" />
  <title>Sign up — Gimkit Community</title>
  <link rel="stylesheet" href="/GimkitWeb/buttons.css" />
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="/GimkitWeb/account-usernames.js"></script>
</head>
<body>
  <a id="backLink" href="/GimkitWeb/">← Back to site</a>
  <h1>Create account</h1>

  <form id="signUpForm" onsubmit="return false;">
    <input id="username" type="text" placeholder="Unique username (3-20 letters, numbers, _ or -)" minlength="3" maxlength="20" pattern="[A-Za-z0-9_-]{3,20}" autocomplete="nickname" autocapitalize="none" required />
    <input id="email" type="email" placeholder="Email (used to sign in)" autocomplete="username" required />
    <input id="password" type="password" placeholder="Password" autocomplete="new-password" required />
    <button id="signUpBtn" class="primary-button" type="button">Create account</button>
    <p id="signUpStatus" role="status" aria-live="polite"></p>
  </form>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDq6eOzOWLd88XG-wFo0LN1O3l2Yyvdfls",
      authDomain: "gimkit-web.firebaseapp.com",
      databaseURL: "https://gimkit-web-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "gimkit-web",
      storageBucket: "gimkit-web.firebasedestorage.app",
      messagingSenderId: "192282058649",
      appId: "1:192282058649:web:cdcdfdb49c429fc0e33d08",
      measurementId: "G-TLCCKP056J"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const authPersistence = auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
    authPersistence.catch(error => console.error('Could not set authentication persistence:', error));
    const defaultReturnTo = "/GimkitWeb/";
    const returnTo = (() => {
      const requested = new URLSearchParams(window.location.search).get("returnTo");
      if (!requested) return defaultReturnTo;
      try {
        const target = new URL(requested, window.location.origin);
        if (target.origin !== window.location.origin ||
            !(target.pathname === "/GimkitWeb" || target.pathname.startsWith("/GimkitWeb/"))) {
          return defaultReturnTo;
        }
        return target.pathname + target.search + target.hash;
      } catch (error) {
        return defaultReturnTo;
      }
    })();
    document.getElementById("backLink").href = returnTo;

    function finishSignUp() {
      window.location.href = returnTo;
    }

    document.getElementById("signUpBtn").addEventListener("click", async () => {
      const username = document.getElementById("username").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const status = document.getElementById("signUpStatus");

      try {
        window.accountUsernames.validate(username);
        if (!email || !password) throw new Error("Enter an email and password.");
        await authPersistence;
        let user = auth.currentUser;
        if (!user || user.email !== email.toLowerCase()) {
          try {
            const userCredential = await auth.createUserWithEmailAndPassword(email, password);
            user = userCredential.user;
          } catch (error) {
            if (error.code !== "auth/email-already-in-use") throw error;
            const userCredential = await auth.signInWithEmailAndPassword(email, password);
            user = userCredential.user;
          }
        }
        await window.accountUsernames.claim(username, user);
        finishSignUp();
      } catch (err) {
        console.error("Could not create account or reserve username:", err);
        status.textContent = err.message || "Could not create the account. Try again.";
      }
    });
  </script>
</body>
</html>
