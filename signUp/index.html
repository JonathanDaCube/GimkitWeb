<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign up — Gimkit Community</title>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>
  <a id="backLink" href="/GimkitWeb/">← Back to site</a>
  <h1>Create account</h1>

  <form id="signUpForm" onsubmit="return false;">
    <input id="username" type="text" placeholder="Username" autocomplete="nickname" />
    <input id="email" type="email" placeholder="Email" autocomplete="username" />
    <input id="password" type="password" placeholder="Password" autocomplete="new-password" />
    <button id="signUpBtn" type="button">Create account</button>
  </form>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDq6eOzOWLd88XG-wFo0LN1O3l2Yyvdfls",
      authDomain: "gimkit-web.firebaseapp.com",
      databaseURL: "https://gimkit-web-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "gimkit-web",
      storageBucket: "gimkit-web.firebasedestorage.app",
      messagingSenderId: "192282058649",
      appId: "1:192282058649:web:cdcdfdb49c429fc0e33d08",
      measurementId: "G-TLCCKP056J"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();
    const defaultReturnTo = "/GimkitWeb/";
    const returnTo = (() => {
      const requested = new URLSearchParams(window.location.search).get("returnTo");
      if (!requested) return defaultReturnTo;
      try {
        const target = new URL(requested, window.location.origin);
        if (target.origin !== window.location.origin ||
            !(target.pathname === "/GimkitWeb" || target.pathname.startsWith("/GimkitWeb/"))) {
          return defaultReturnTo;
        }
        return target.pathname + target.search + target.hash;
      } catch (error) {
        return defaultReturnTo;
      }
    })();
    document.getElementById("backLink").href = returnTo;

    function finishSignUp() {
      window.location.href = returnTo;
    }

    function saveUserProfile(user, username, createdAt) {
      const profile = { updatedAt: Date.now() };
      const displayName = username || user.displayName;
      if (displayName) profile.username = displayName;
      if (user.email) profile.email = user.email.toLowerCase();
      if (createdAt) profile.createdAt = createdAt;
      return db.ref("users/" + user.uid).update(profile);
    }

    document.getElementById("signUpBtn").addEventListener("click", () => {
      const username = document.getElementById("username").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      auth.createUserWithEmailAndPassword(email, password)
        .then(async (userCredential) => {
          const user = userCredential.user;
          await user.updateProfile({ displayName: username });
          await saveUserProfile(user, username, Date.now());
          finishSignUp();
        })
        .catch((err) => {
          if (err.code === "auth/email-already-in-use") {
            auth.signInWithEmailAndPassword(email, password)
              .then(async userCredential => {
                await saveUserProfile(userCredential.user);
                finishSignUp();
              })
              .catch(signErr => alert(signErr.message));
          } else {
            alert(err.message);
          }
        });
    });
  </script>
</body>
</html>
