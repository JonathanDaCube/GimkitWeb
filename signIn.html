<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in — Gimkit Community</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 24px;
      max-width: 600px;
      margin: 0 auto;
    }
    h1 { margin-top: 12px; }
    form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 12px;
    }
    input {
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 1rem;
    }
    button {
      padding: 10px 14px;
      border-radius: 6px;
      border: none;
      background: #007bff;
      color: white;
      cursor: pointer;
      font-size: 1rem;
    }
    .google-btn {
      background: #4285F4;
      width: 100%;
    }
    .auth-divider {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #666;
      font-size: 0.9rem;
    }
    .auth-divider::before,
    .auth-divider::after {
      content: "";
      height: 1px;
      background: #ddd;
      flex: 1;
    }
    .error {
      color: #b33;
      min-height: 20px;
    }
    .small {
      font-size: 0.9rem;
      color: #555;
    }
  </style>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
</head>
<body>
  <a href="/GimkitWeb/">← Back to site</a>
  <h1>Sign in</h1>

  <form id="signInForm" onsubmit="return false;">
    <input id="email" type="email" placeholder="Email" required autocomplete="username" />
    <input id="password" type="password" placeholder="Password" required autocomplete="current-password" />
    <button id="signInBtn" type="button">Sign in</button>
    <div class="auth-divider" aria-hidden="true">or</div>
    <button id="googleSignInBtn" type="button" class="google-btn">Sign in with Google</button>
    <div id="errorMsg" class="error" role="alert" aria-live="polite"></div>
  </form>

  <p class="small">Don't have an account? <a href="/GimkitWeb/signUp.html">Create one</a></p>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDq6eOzOWLd88XG-wFo0LN1O3l2Yyvdfls",
      authDomain: "gimkit-web.firebaseapp.com",
      databaseURL: "https://gimkit-web-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "gimkit-web",
      storageBucket: "gimkit-web.firebasestorage.app",
      messagingSenderId: "192282058649",
      appId: "1:192282058649:web:cdcdfdb49c429fc0e33d08",
      measurementId: "G-TLCCKP056J"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    const emailEl = document.getElementById('email');
    const passwordEl = document.getElementById('password');
    const signInBtn = document.getElementById('signInBtn');
    const googleSignInBtn = document.getElementById('googleSignInBtn');
    const errorMsg = document.getElementById('errorMsg');

    function showError(msg) {
      errorMsg.textContent = msg || '';
    }

    signInBtn.addEventListener('click', () => {
      showError('');
      const email = emailEl.value.trim();
      const password = passwordEl.value;
      if (!email || !password) {
        showError('Please enter both email and password.');
        return;
      }

      auth.signInWithEmailAndPassword(email, password)
        .then(() => {
          window.location.href = '/GimkitWeb/';
        })
        .catch(err => {
          console.error('Sign-in failed:', err);
          showError(err.message || 'Sign-in failed.');
        });
    });

    googleSignInBtn.addEventListener('click', () => {
      showError('');
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider)
        .then(() => {
          window.location.href = '/GimkitWeb/';
        })
        .catch(err => {
          console.error('Google sign-in failed:', err);
          showError(err.message || 'Google sign-in failed.');
        });
    });
  </script>
</body>
</html>
